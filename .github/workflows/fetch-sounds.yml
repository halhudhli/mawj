name: Fetch CC0 sea sounds
on:
  push:
    branches: [sounds-src]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 recordings
        run: |
          mkdir -p sounds-src
          cd sounds-src
          for i in 01 02 03 04; do
            curl -fsSL -A "Mozilla/5.0" -o wave_$i.flac "https://opengameart.org/sites/default/files/wave_${i}_cc0-18363__jasinski__alkaibeach.flac" || echo "fail $i"
          done
          curl -fsSL -A "Mozilla/5.0" -o sea_0266.mp3 "https://bigsoundbank.com/UPLOAD/mp3/0266.mp3" || echo "fail 0266"
          curl -fsSL -A "Mozilla/5.0" -o sea_0267.mp3 "https://bigsoundbank.com/UPLOAD/mp3/0267.mp3" || echo "fail 0267"
          ls -la
          printf 'wave_0x.flac: "beach ocean waves" by jasinski (freesound 18363), via OpenGameArt (qubodup), CC0.\nsea_0266/0267.mp3: BigSoundBank (Denis Chardonnet), CC0.\n' > SOURCES.txt
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/fetch-sounds.yml
          git add sounds-src
          git commit -m "CC0 sea recordings (source material for Mawj sounds)" && git push
