name: Build LUXO APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # سيرفر GitHub للمستودعات الخاصة ذاكرته قليلة، فنفضّي مساحة ونضيف ذاكرة احتياطية (swap)
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # الإعدادات الأصلية تطلب 12 جيجا ذاكرة، نخففها عشان تناسب السيرفر المجاني
      - name: Lower Gradle memory for CI
        run: |
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Xms512m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC/' gradle.properties
          sed -i -E 's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          cat gradle.properties

      - name: Create local.properties
        run: touch local.properties

      - name: Build APK (full, debug, arm64)
        run: >
          ./gradlew :androidApp:assembleFullDebug
          -Pnuvio.android.distribution=full
          -Pnuvio.ios.distribution=appstore
          -Pluxo.abi=arm64-v8a
          -Pkotlin.compiler.execution.strategy=in-process
          --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUXO-Stream-APK
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
