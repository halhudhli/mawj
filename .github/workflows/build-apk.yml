name: Build Mawj APK

on:
  push:
    branches: [ "main" ]
    # Instructions for coding assistants only: no new release for them.
    paths-ignore: [ "AGENTS.md" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # سيرفر GitHub للمستودعات الخاصة ذاكرته قليلة، فنفضّي مساحة ونضيف ذاكرة احتياطية (swap)
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # الإعدادات الأصلية تطلب 12 جيجا ذاكرة، نخففها عشان تناسب السيرفر المجاني
      - name: Lower Gradle memory for CI
        run: |
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Xms512m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC/' gradle.properties
          sed -i -E 's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          cat gradle.properties

      - name: Create local.properties
        run: touch local.properties

      - name: Build APK (full, debug, arm64)
        env:
          # اختياري: لو أضفت مفتاح TMDB كـ secret يندمج في التطبيق وتطلع العناوين والأوصاف بالعربي تلقائياً
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          # اختيارية: أي مفتاح تضيفه كـ secret يشغّل الخدمة المرتبطة فيه
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          # مفتاح قراءة فقط عشان التطبيق يشوف التحديثات (المستودع خاص)
          LUXO_UPDATE_TOKEN: ${{ secrets.LUXO_UPDATE_TOKEN }}
          LUXO_GEMINI_KEY: ${{ secrets.LUXO_GEMINI_KEY }}
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pluxo.abi=arm64-v8a \
            -Pluxo.fastDebug=true \
            -Pnuvio.app.versionName=1.0.${{ github.run_number }} \
            -Pnuvio.app.versionCode=$((1000 + ${{ github.run_number }})) \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --stacktrace 2>&1 | tee build.log
          # نسخة التابلت (arm64) نحفظها، وبعدين نبني نسخة الشاشات 32-bit (armeabi-v7a)
          mkdir -p luxo-out
          cp "$(ls androidApp/build/outputs/apk/full/debug/*.apk | head -1)" luxo-out/arm64-v8a.apk
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            -Pluxo.abi=armeabi-v7a \
            -Pluxo.fastDebug=true \
            -Pluxo.minify=true \
            -Pluxo.tv=true \
            -Pnuvio.app.versionName=1.0.${{ github.run_number }} \
            -Pnuvio.app.versionCode=$((1000 + ${{ github.run_number }})) \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --stacktrace 2>&1 | tee -a build.log
          cp "$(ls -t androidApp/build/outputs/apk/full/debug/*.apk | head -1)" luxo-out/armeabi-v7a.apk

      # يحوّل أخطاء Kotlin إلى تنبيهات تظهر في صفحة البناء وتُقرأ عبر الـ API
      - name: Report compile errors
        if: failure()
        run: |
          # GitHub يعرض 10 تنبيهات فقط لكل خطوة، فنجمع الأخطاء في تنبيهات مجمّعة
          grep -E '^e: ' build.log | sed 's#.*/composeApp/src/#src/#' | head -80 > errs.txt || true
          split -l 8 errs.txt errpart_ || true
          for f in errpart_*; do
            [ -s "$f" ] && echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
          done
          awk '/What went wrong/{f=1;c=0} f{print; if(++c>12) f=0}' build.log | head -25 > wrong.txt
          [ -s wrong.txt ] && echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' wrong.txt)" || true

      - name: Upload APK
        # The release below is what the app updates from; a full artifact store must not block it.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Mawj-APK
          path: luxo-out/*.apk
          if-no-files-found: error
          retention-days: 2

      # ينشر كل بناء ناجح كإصدار، والتطبيق يشيك عليه ويحدّث نفسه
      - name: Publish release for in-app updates
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_UPDATE_TOKEN: ${{ secrets.LUXO_UPDATE_TOKEN != '' }}
          HAS_GEMINI_KEY: ${{ secrets.LUXO_GEMINI_KEY != '' }}
          HAS_TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID != '' }}
          HAS_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET != '' }}
          HAS_SIMKL: ${{ secrets.SIMKL_CLIENT_ID != '' }}
          HAS_MDBLIST: ${{ secrets.MDBLIST_API_KEY != '' }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          cp luxo-out/arm64-v8a.apk "Mawj-${VERSION}-tablet-arm64-v8a.apk"
          cp luxo-out/armeabi-v7a.apk "Mawj-${VERSION}-TV-armeabi-v7a.apk"
          git log -1 --pretty=%B | grep -v '^Co-Authored-By\|^Claude-Session' > notes.txt
          echo "" >> notes.txt
          echo "<!-- luxo-build update-token=${HAS_UPDATE_TOKEN} gemini-key=${HAS_GEMINI_KEY} trakt-id=${HAS_TRAKT_ID} trakt-secret=${HAS_TRAKT_SECRET} simkl=${HAS_SIMKL} mdblist=${HAS_MDBLIST} -->" >> notes.txt
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "Mawj-${VERSION}-tablet-arm64-v8a.apk" "Mawj-${VERSION}-TV-armeabi-v7a.apk" --clobber
          else
            gh release create "v${VERSION}" "Mawj-${VERSION}-tablet-arm64-v8a.apk" "Mawj-${VERSION}-TV-armeabi-v7a.apk" \
              --title "موج ${VERSION}" --notes-file notes.txt --target "${{ github.sha }}"
          fi
          # نخلي آخر 5 إصدارات بس
          gh release list --limit 100 --json tagName -q '[.[] | select(.tagName != "iphone")] | .[5:][].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
