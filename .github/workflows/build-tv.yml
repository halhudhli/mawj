name: Build Mawj TV

# «موج» للشاشة: التطبيق الجديد المستقل (tvApp). ينبني لحاله وينشر في إصدار ثابت اسمه tv.
on:
  push:
    branches: [ "main" ]
    paths: [ "tv/**", ".github/workflows/build-tv.yml" ]
  workflow_dispatch:

concurrency:
  group: build-tv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare build (Mawj key, Nuvio account servers, no secrets in the repo)
        working-directory: tv
        env:
          SUPA_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          sed -i -E 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -Xms512m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC/' gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          # Same public client settings the phone app already uses (read from its build file).
          [ -z "$SUPA_URL" ] && SUPA_URL=$(grep -o 'NUVIO_SUPABASE_URL", "[^"]*' ../composeApp/build.gradle.kts | sed 's/.*"//')
          [ -z "$SUPA_KEY" ] && SUPA_KEY=$(grep -o 'NUVIO_SUPABASE_ANON_KEY", "[^"]*' ../composeApp/build.gradle.kts | sed 's/.*"//')
          {
            echo "SUPABASE_URL=$SUPA_URL"
            echo "SUPABASE_ANON_KEY=$SUPA_KEY"
            echo "NUVIO_SUPABASE_URL=$SUPA_URL"
            echo "NUVIO_SUPABASE_ANON_KEY=$SUPA_KEY"
            echo "TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob"
            echo "USE_LOCAL_FFMPEG_DECODER=false"
            echo "DOVI_NATIVE_ENABLED=true"
            echo "DOVI_EXTRACTOR_HOOK_READY=true"
            echo "DOVI_ENABLE_REAL_LINK=true"
            echo "DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi"
          } > local.properties
          touch local.dev.properties
          echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/androidApp/luxo-debug.keystore" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "NUVIO_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          python3 native/usenet/scripts/fetch_prebuilts.py
          python3 native/usenet/scripts/check_prebuilts.py

      - name: Build TV APK
        working-directory: tv
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleFullRelease \
            -Pmawj.tv.versionName=1.2.${{ github.run_number }}-mawj \
            -Pmawj.tv.versionCode=$((2000 + ${{ github.run_number }})) \
            --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#.*/tv/app/src/main/java/##' | head -80 > errs.txt || true
          split -l 8 errs.txt errpart_ || true
          for f in errpart_*; do
            [ -s "$f" ] && echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"
          done
          awk '/What went wrong/{f=1;c=0} f{print; if(++c>12) f=0}' build.log | head -25 > wrong.txt
          [ -s wrong.txt ] && echo "::error::$(sed ':a;N;$!ba;s/\n/%0A/g' wrong.txt)" || true

      - name: Publish to the "tv" release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls tv/app/build/outputs/apk/full/release/*.apk | grep -i 'armeabi-v7a\|universal' | head -1)
          [ -z "$APK" ] && APK=$(ls tv/app/build/outputs/apk/full/release/*.apk | head -1)
          ls -la tv/app/build/outputs/apk/full/release/
          NAME="Mawj-TV-1.2.${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          if ! gh release view tv >/dev/null 2>&1; then
            gh release create tv --title "موج للشاشة" --notes "تطبيق الشاشة الجديد. آخر نسخة دائماً هنا." --target "${{ github.sha }}"
          fi
          for old in $(gh release view tv --json assets -q '.assets[].name'); do gh release delete-asset tv "$old" --yes || true; done
          gh release upload tv "$NAME" --clobber
